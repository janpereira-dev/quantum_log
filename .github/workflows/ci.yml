name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  artifact-lifecycle-contract:
    uses: ./.github/workflows/artifact-lifecycle.yml

  release-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: latest
          args: check
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.10'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false
      - run: go mod tidy
      - run: git diff --exit-code go.mod go.sum
      - run: test -z "$(gofmt -l $(git ls-files '*.go'))"
        shell: bash
      - run: go vet ./...
      - run: go test ./...
      - run: go test -race ./...
      - run: go build ./...
      - name: Smoke simple portable archive with synthetic sessions
        shell: bash
        run: |
          set -euo pipefail
          stage="$(mktemp -d)"
          trap 'rm -rf "$stage"' EXIT
          suffix=''
          if [ "$RUNNER_OS" = 'Windows' ]; then suffix='.exe'; fi
          build_date="$(git show -s --format=%cI HEAD)"
          go build -trimpath -ldflags "-X main.version=ci -X main.commit=$GITHUB_SHA -X main.date=$build_date" -o "$stage/qlog-simple$suffix" ./cmd/qlog
          mkdir "$stage/fixtures"
          cp fixtures/demo-session.jsonl "$stage/fixtures/"
          tar -czf "$stage/simple.tar.gz" -C "$stage" "qlog-simple$suffix" fixtures
          node scripts/acceptance/verify-simple-artifact.js "$stage/simple.tar.gz"
      - name: Test legacy npm packaging fixture without downloads
        run: node --test packaging/npm/tests/install.test.js
      - run: node packaging/npm/scripts/postinstall.js --dry-run
      - run: sh -n installers/install.sh installers/uninstall.sh
        shell: bash
      - run: pwsh -NoProfile -File installers/install.ps1 --dry-run --version v0.0.0 --install-dir "${{ runner.temp }}/qlog-bin" --no-modify-path
        if: runner.os == 'Windows'
      - run: pwsh -NoProfile -File installers/uninstall.ps1 --dry-run --install-dir "${{ runner.temp }}/qlog-bin" --no-modify-path
        if: runner.os == 'Windows'
      - run: cmd /c installers\install.cmd --dry-run --version v0.0.0 --install-dir "%RUNNER_TEMP%\qlog-bin" --no-modify-path
        if: runner.os == 'Windows'
      - run: cmd /c installers\uninstall.cmd --dry-run --install-dir "%RUNNER_TEMP%\qlog-bin" --no-modify-path
        if: runner.os == 'Windows'
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.10'
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...
