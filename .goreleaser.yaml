version: 2
project_name: quantum-log
builds:
  - id: qlog
    # Published installers bootstrap setup/doctor and need the legacy command set.
    # The simple product ships under its own binary and archive names.
    main: ./cmd/qlog-legacy
    binary: qlog
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.commit={{ .Commit }} -X main.date={{ .CommitDate }}
  - id: qlog-simple
    main: ./cmd/qlog
    binary: qlog-simple
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.commit={{ .Commit }} -X main.date={{ .CommitDate }}
archives:
  - id: default
    ids: [qlog]
    name_template: "qlog_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
  - id: simple
    ids: [qlog-simple]
    name_template: "qlog-simple_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - src: packaging/simple/README.md
        dst: .
        strip_parent: true
      - fixtures/demo-session.jsonl
checksum:
  name_template: checksums.txt
sboms:
  - id: archive
    artifacts: archive
changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
release:
  draft: true
  prerelease: auto
  # RC tags deliberately use the form -rcN (for example v0.4.0-rc10). That is
  # the prerelease indicator understood by GoReleaser's `auto` mode.
  # Keep prereleases out of GitHub's /releases/latest endpoint even if a
  # hosting-side classification changes unexpectedly.
  make_latest: '{{ if or (contains "-alpha" .Tag) (contains "-beta" .Tag) (contains "-rc" .Tag) }}false{{ else }}true{{ end }}'
  footer: |
    Full project history: https://github.com/janpereira-dev/quantum_log/blob/{{ .Tag }}/CHANGELOG.md
