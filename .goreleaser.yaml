version: 2
project_name: quantum-log
before:
  hooks:
    - go mod tidy
builds:
  - id: qlog
    main: ./cmd/qlog
    binary: qlog
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.commit={{ .Commit }} -X main.date={{ .CommitDate }}
archives:
  - id: default
    name_template: "qlog_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
sboms:
  - id: archive
    artifacts: archive
changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
release:
  prerelease: auto
  # RC tags deliberately use the form -rcN (for example v0.4.0-rc9). That is
  # the prerelease indicator understood by GoReleaser's `auto` mode.
  # Keep prereleases out of GitHub's /releases/latest endpoint even if a
  # hosting-side classification changes unexpectedly.
  make_latest: '{{ if or (contains .Tag "-alpha") (contains .Tag "-beta") (contains .Tag "-rc") }}false{{ else }}true{{ end }}'
  footer: |
    Full project history: https://github.com/janpereira-dev/quantum_log/blob/{{ .Tag }}/CHANGELOG.md
snapshot:
  version_template: "0.4.0-rc9"
